  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #d1cfcd;
      border-radius: 18px;
      padding: 32px 36px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      max-width: 400px;
      width: 100%;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 18px;
      font-weight: 600;
    }
    p {
      margin: 0 0 18px 0;
      font-size: 13px;
      color: #605e5c;
      line-height: 1.5;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #e1dfdd;
      border-top-color: #0078d4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block;
      padding: 10px 18px;
      background: #0078d4;
      color: #ffffff;
      text-decoration: none;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:hover { background: #106ebe; }
    .hidden { display: none; }
  </style>
</head>

    <h1>Bileşim Çalışma Alanı</h1>
    <div id="spinner" class="spinner"></div>
    <p id="status">Canlı iMac tüneline bağlanılıyor...</p>
    <button id="retryBtn" class="btn hidden" onclick="connect()">Tekrar Dene</button>
  </div>
  <script>
    var TOPIC = "bilesim-8c41f0d2a97e4b3c85e6d1f29a07b4ce";
    var FALLBACK = "https://responding-manufacture-wells-chronicle.trycloudflare.com";
    var statusEl = document.getElementById("status");
    var spinnerEl = document.getElementById("spinner");
    var retryBtn = document.getElementById("retryBtn");
    var retryTimer = null;

    function targetSuffix() {
      var p = window.location.pathname || "/";
      if (p === "/index.html" || p === "/404.html") p = "/";
      return p + (window.location.search || "") + (window.location.hash || "");
    }

    function probeTunnel(baseUrl) {
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 7000);
      return fetch(baseUrl + "/api/system/remote-mode?ping=true", {
        mode: "cors",
        cache: "no-store",
        signal: ctrl.signal
      })
        .then(function (r) { clearTimeout(timer); return r.ok; })
        .catch(function () { clearTimeout(timer); return false; });
    }

    function fetchCandidates() {
      return fetch("https://ntfy.sh/" + TOPIC + "/json?poll=1&since=12h", { cache: "no-store" })
        .then(function (r) { return r.text(); })
        .then(function (txt) {
          var seen = {};
          var list = [];
          var lines = txt.split("\n").filter(Boolean);
          for (var i = lines.length - 1; i >= 0; i--) {
            try {
              var m = JSON.parse(lines[i]);
              if (m && m.event === "message" && typeof m.message === "string") {
                var u = m.message.trim().replace(/\/$/, "");
                if (/^https:\/\/[a-zA-Z0-9-]+\.trycloudflare\.com$/.test(u) && !seen[u]) {
                  seen[u] = true;
                  list.push(u);
                }
              }
            } catch (e) {}
          }
          if (FALLBACK && !seen[FALLBACK]) list.push(FALLBACK);
          return list;
        })
        .catch(function () {
          return FALLBACK ? [FALLBACK] : [];
        });
    }

    function connect() {
      if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
      spinnerEl.classList.remove("hidden");
      retryBtn.classList.add("hidden");
      statusEl.textContent = "Canlı iMac tüneline bağlanılıyor...";

      var suffix = targetSuffix();
      fetchCandidates().then(function (candidates) {
        (function tryNext(i) {
          if (i >= candidates.length) {
            spinnerEl.classList.add("hidden");
            retryBtn.classList.remove("hidden");
            statusEl.textContent = "Ofis iMac bağlantısı şu an yanıt vermiyor (yeniden başlıyor olabilir). 6 saniye içinde otomatik tekrar denenecek...";
            retryTimer = setTimeout(connect, 6000);
            return;
          }
          var base = candidates[i];
          probeTunnel(base).then(function (ok) {
            if (ok) {
              statusEl.textContent = "Bağlandı, yönlendiriliyor...";
              window.location.replace(base + suffix);
            } else {
              tryNext(i + 1);
            }
          });
        })(0);
      });
    }

    connect();
  </script>
